name: roz-clinic

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: roz
      POSTGRES_USER: roz
      POSTGRES_PASSWORD: roz_dev
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roz -d roz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: docker.arvancloud.ir/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: roz
      MINIO_ROOT_PASSWORD: roz_dev_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - "miniodata:/data"

  api:
    profiles: ["full"]
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://roz:roz_dev@db:5432/roz
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - "../backend:/app"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    profiles: ["full"]
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://roz:roz_dev@db:5432/roz
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "../backend:/app"
    command: celery -A app.worker.celery_app worker -l info --pool=solo

volumes:
  pgdata:
  miniodata:
